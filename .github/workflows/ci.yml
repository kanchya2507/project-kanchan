name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:                       ## CHANGED: only run for app changes, not Terraform changes
      - 'project-api/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'project-api/**'
      - '.github/workflows/ci.yml'
# permissions:
#   id-token: write #
#   contents: read

concurrency:                     # NEW: never run two deployments at once
  group: app-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'project-api/requirements.txt'

      - name: Install dependencies
        working-directory: ./project-api
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx flake8

      - name: Lint with flake8
        working-directory: ./project-api
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with pytest
        working-directory: ./project-api
        env:
          PYTHONPATH: .
        run: |
          pytest

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write            # needed for AWS OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./project-api
          platforms: linux/amd64          # NEW: Fargate task in this stack is X86_64
          push: true
          cache-from: type=gha            # NEW: faster rebuilds
          cache-to: type=gha,mode=max
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fastapi-app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/fastapi-app:${{ github.sha }}

      # ======================= DEPLOY TO AWS ECS FARGATE =======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # CHANGED: names now come from repo variables (new stack: fastapi)
      - name: Download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}   # Terraform default: app
          image: ${{ vars.DOCKERHUB_USERNAME }}/fastapi-app:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}                 # fastapi-service
          cluster: ${{ vars.ECS_CLUSTER }}                 # fastapi-cluster
          wait-for-service-stability: true