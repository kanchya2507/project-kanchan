name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'project-api/requirements.txt' 

      - name: Install dependencies
        working-directory: ./project-api
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx flake8 

      - name: Lint with flake8
        working-directory: ./project-api
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with pytest
        working-directory: ./project-api
        env:
          PYTHONPATH: .
        run: |
          pytest

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # 1. CRUCIAL ADDITION: Grants permission to exchange tokens with AWS OIDC
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./project-api
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fastapi-app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/fastapi-app:${{ github.sha }}

      # =======================================================================
      # 2. CONTINUOUS DELIVERY STEPS: DEPLOYING TO AWS ECS FARGATE
      # =======================================================================

      # Step 1: Login securely to AWS using your new IAM OIDC Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 2: Download your current Task Definition from your AWS cluster
      - name: Download active task definition
        run: |
          aws ecs describe-task-definition --task-definition fastapi-task --query taskDefinition > task-definition.json

      # Step 3: Swap out the target image reference for your new Git Commit SHA
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main # Must match the exact Container name inside your Task definition JSON
          image: ${{ vars.DOCKERHUB_USERNAME }}/fastapi-app:${{ github.sha }}

      # Step 4: Submit the updated schema file back to AWS ECS to run a rolling update
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: fastapi-task-service-44vbmspx # Matches your service name precisely
          cluster: api-cluster                  # Matches your cluster name precisely
          wait-for-service-stability: true      # Monitors execution logs until new containers pass health checks
